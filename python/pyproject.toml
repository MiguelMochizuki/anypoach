[project]
name = "poach"
version = "0.1.0"
description = "Portable Poach: capture, analysis and MCP server."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["av", "numpy", "mcp", "platformdirs"]

[project.optional-dependencies]
ui = ["PySide6", "mss"]

[project.scripts]
poach-mcp = "poach.mcp.server:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real display (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
