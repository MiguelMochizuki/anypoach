<!doctype html>
<meta charset="utf-8">
<title>capture test page</title>
<style>
  #target { width: 100px; height: 40px; background: #2378ff; }
  #target.wide { width: 220px; }
</style>
<button id="target">Go</button>
<pre id="out"></pre>
<script>
  window.__messages = [];
  let listener;
  window.chrome = {
    runtime: { id: "test", sendMessage: message => { window.__messages.push(message); return Promise.resolve({ ok: true }); },
               onMessage: { addListener: fn => { listener = fn; } } },
  };
</script>
<script src="capture.js"></script>
<script>
  const target = document.getElementById("target");
  window.__anypoachTest.start(target);
  setTimeout(() => {
    target.classList.add("wide");
    target.animate([{ opacity: 1 }, { opacity: 0.5 }], { duration: 300, easing: "ease-out" });
  }, 200);
  setTimeout(() => listener({ anypoach: "finish" }, { id: "test" }, reply => {
    document.getElementById("out").textContent = JSON.stringify({ evidence: reply.evidence, streamed: window.__messages.length });
    document.title = "done";
  }), 1200);
</script>
