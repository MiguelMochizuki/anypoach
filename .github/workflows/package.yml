name: Package
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/package.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux}
          - {os: windows-latest, label: windows}
          - {os: macos-latest, label: macos}
    env:
      NAME: AnyPoach-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.label }}.zip
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the libraries PySide6 loads on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --extra ui
      - run: uv run --with pyinstaller pyinstaller packaging/anypoach.spec --noconfirm
      - name: Smoke-test the packaged programs and zip them
        run: uv run python packaging/finish.py dist/AnyPoach "$NAME"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.NAME }}
          retention-days: 7
  release:
    name: Attach the builds to the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Build the Claude Desktop extension
        run: uv run python tools/build_mcpb.py builds/AnyPoach.mcpb
      - name: Checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd builds
          sha256sum *.zip AnyPoach.mcpb > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" *.zip AnyPoach.mcpb SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
